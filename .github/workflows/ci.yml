name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest -q
      - name: Run target-bound benchmark regression
        run: |
          python -m cost_model --benchmark benchmarks/target_bounds.json --compact > /tmp/target_bounds.actual.json
          diff -u benchmarks/target_bounds.expected.json /tmp/target_bounds.actual.json
      - name: Run benchmark budget gate
        run: python -m cost_model --benchmark benchmarks/target_bounds.json --budget benchmarks/target_bounds.budget.json --compact > /tmp/target_bounds.budget.actual.json
